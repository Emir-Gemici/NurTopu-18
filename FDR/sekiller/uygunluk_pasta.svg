<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif">
  <title>Genel uygunluk dağılımı — 45 gereksinim satırı (FDR §6.6.2)</title>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#111111">Genel uygunluk dağılımı — 45 gereksinim satırı</text>
  <text x="24" y="62" font-size="13" fill="#444444">Sayım kuralı: her satırın baskın durumu (§6.3.1); döküm §6.6.1. "Kanıtlı" = kapı koştu ve ayırt edici, "sahada çalıştı" değil (§6.6.6).</text>
  <g id="dilimler" data-toplam="45" data-cx="270.000" data-cy="318.000" data-r-dis="165.000" data-r-ic="100.000">
    <path class="dilim" data-durum="KANITLI_TEST" data-satir="32" data-oran="%71,1" d="M 270.000 153.000 A 165.000 165.000 0 1 1 109.901 357.917 L 172.970 342.192 A 100.000 100.000 0 1 0 270.000 218.000 Z" fill="#0ca30c" stroke="#ffffff" stroke-width="2"/>
    <path class="dilim" data-durum="İNSAN-DONANIM" data-satir="7" data-oran="%15,6" d="M 109.901 357.917 A 165.000 165.000 0 0 1 147.381 207.593 L 195.686 251.087 A 100.000 100.000 0 0 0 172.970 342.192 Z" fill="#8a8a86" stroke="#ffffff" stroke-width="2"/>
    <path class="dilim" data-durum="KOD_VAR_TEST_YOK" data-satir="4" data-oran="%8,9" d="M 147.381 207.593 A 165.000 165.000 0 0 1 224.520 159.392 L 242.436 221.874 A 100.000 100.000 0 0 0 195.686 251.087 Z" fill="#d99a00" stroke="#ffffff" stroke-width="2"/>
    <path class="dilim" data-durum="ÖLÇÜLEMEDİ" data-satir="2" data-oran="%4,4" d="M 224.520 159.392 A 165.000 165.000 0 0 1 270.000 153.000 L 270.000 218.000 A 100.000 100.000 0 0 0 242.436 221.874 Z" fill="#d03b3b" stroke="#ffffff" stroke-width="2"/>
  </g>
  <g id="degerler">
    <text x="420.510" y="440.591" text-anchor="start" font-size="13" fill="#111111">32 (%71,1)</text>
    <text x="84.674" y="276.793" text-anchor="end" font-size="13" fill="#111111">7 (%15,6)</text>
    <text x="168.785" y="161.023" text-anchor="end" font-size="13" fill="#111111">4 (%8,9)</text>
    <text x="243.418" y="133.859" text-anchor="end" font-size="13" fill="#111111">2 (%4,4)</text>
  </g>
  <text x="270.000" y="316.000" text-anchor="middle" font-size="40" font-weight="bold" fill="#111111">45</text>
  <text x="270.000" y="342.000" text-anchor="middle" font-size="14" fill="#444444">gereksinim satırı</text>
  <g id="lejant">
    <rect x="540" y="199" width="18" height="18" fill="#0ca30c"/>
    <text x="570" y="214" font-size="15" font-weight="bold" fill="#111111">KANITLI_TEST</text>
    <text x="570" y="234" font-size="13" fill="#444444">32 satır · %71,1 — kanıtlı (kapı koştu, ayırt edici)</text>
    <rect x="540" y="259" width="18" height="18" fill="#8a8a86"/>
    <text x="570" y="274" font-size="15" font-weight="bold" fill="#111111">İNSAN-DONANIM</text>
    <text x="570" y="294" font-size="13" fill="#444444">7 satır · %15,6 — kapsam dışı (insan/donanım)</text>
    <rect x="540" y="319" width="18" height="18" fill="#d99a00"/>
    <text x="570" y="334" font-size="15" font-weight="bold" fill="#111111">KOD_VAR_TEST_YOK</text>
    <text x="570" y="354" font-size="13" fill="#444444">4 satır · %8,9 — kısmen (kod var, test yok)</text>
