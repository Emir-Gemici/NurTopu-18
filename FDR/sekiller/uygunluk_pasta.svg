    <text x="570" y="414" font-size="13" fill="#444444">2 satır · %4,4 — açık (ölçülemedi)</text>
  </g>
  <text x="24" y="526" font-size="12" fill="#444444">Renk anlamı: yeşil = kanıtlı · gri = yazılım kapsamı dışı · sarı = kısmen · kırmızı = açık. Her dilim etiket + sayı + yüzde taşır.</text>
  <text x="24" y="546" font-size="12" fill="#444444">kaynak: FDR Bölüm 6 §6.6.2 (yeniden sayım 5 Eylül sonrası) · 7 Eylül 2026 · üretici: scripts/fdr_sekil_uret.py</text>
