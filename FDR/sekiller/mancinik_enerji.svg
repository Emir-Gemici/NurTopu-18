<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" font-family="sans-serif">
<rect width="900" height="545" fill="#ffffff"/>
<text x="20" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2933" text-anchor="start">Mancınık enerji zinciri — SEMBOLİK ÇERÇEVE (sayısal veri yok)</text>
<text x="20" y="50" font-family="sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Y-3.2.3-A02 · gerçek k, x, m, θ değerleri BEYAN GEREKLİ (bkz. §3.2.3 T04/A01)</text>
<line x1="30" y1="340" x2="870" y2="340" stroke="#374151" stroke-width="2"/>
<rect x="60" y="314" width="280" height="10" fill="none" stroke="#1f2933" stroke-width="2"/>
<text x="200" y="348" font-family="sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">kızak uzunluğu</text>
<text x="190" y="370" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="start">x</text><text x="190" y="386" font-family="sans-serif" font-size="10" font-weight="normal" fill="#b45309" text-anchor="start">(BEYAN GEREKLİ)</text>
<polyline points="75,319 90.0,309 105.0,329 120.0,309 135.0,329 150.0,309 165.0,329 180,319" fill="none" stroke="#b91c1c" stroke-width="3"/>
<text x="70" y="275" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="start">k (yay sabiti)</text><text x="70" y="291" font-family="sans-serif" font-size="10" font-weight="normal" fill="#b45309" text-anchor="start">(BEYAN GEREKLİ)</text>
<polygon points="200,308 270,308 270,294 215,294" fill="#1d4ed8" opacity="0.85"/>
<text x="235" y="288" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">İHA (kütle m)</text>
<text x="190" y="253" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="start">m</text><text x="190" y="269" font-family="sans-serif" font-size="10" font-weight="normal" fill="#b45309" text-anchor="start">(BEYAN GEREKLİ)</text>
<line x1="340" y1="308" x2="480" y2="218" stroke="#1f2933" stroke-width="2.5" marker-end="url(#ok)"/>
<text x="460" y="208" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="start">v0 (çıkış hızı)</text><text x="460" y="224" font-family="sans-serif" font-size="10" font-weight="normal" fill="#b45309" text-anchor="start">(BEYAN GEREKLİ)</text>
<path d="M 380,308 A 40 40 0 0 0 368,275" fill="none" stroke="#374151" stroke-width="1.5"/>
<text x="386" y="296" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="start">θ (fırlatma açısı)</text><text x="386" y="312" font-family="sans-serif" font-size="10" font-weight="normal" fill="#b45309" text-anchor="start">(BEYAN GEREKLİ)</text>
<polyline points="340.0,308.0 361.0,283.3 382.0,261.2 403.0,241.7 424.0,224.8 445.0,210.5 466.0,198.8 487.0,189.7 508.0,183.2 529.0,179.3 550.0,178.0 571.0,179.3 592.0,183.2 613.0,189.7 634.0,198.8 655.0,210.5 676.0,224.8 697.0,241.7 718.0,261.2 739.0,283.3 760.0,308.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="340" y1="358" x2="760" y2="358" stroke="#374151" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="535" y="372" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="start">R (menzil)</text><text x="535" y="388" font-family="sans-serif" font-size="10" font-weight="normal" fill="#b45309" text-anchor="start">(BEYAN GEREKLİ)</text>
<defs><marker id="ok" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#374151"/></marker></defs>
<rect x="20" y="406" width="860" height="104" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
<text x="34" y="430" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1f2933" text-anchor="start">Enerji zinciri (sembolik, sayı yok — BEYAN GEREKLİ değişkenler yukarıda):</text>
<text x="34" y="452" font-family="monospace" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">1) Depolanan enerji:      E = ½ · k · x²</text>
<text x="34" y="474" font-family="monospace" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">2) Çıkış hızı (m kütleye aktarım, kayıpsız üst sınır):   v0 = √(2E / m)</text>
<text x="34" y="496" font-family="monospace" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="start">3) İdeal menzil (düz zemin, hava direnci ihmal):   R = v0² · sin(2θ) / g</text>
</svg>
