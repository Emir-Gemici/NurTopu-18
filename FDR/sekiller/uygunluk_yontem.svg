<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif">
  <title>Doğrulama yöntemi dağılımı — 45 satır, 66 atama (FDR §6.6.3)</title>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#111111">Doğrulama yöntemi dağılımı — 45 satır, 66 yöntem ataması</text>
  <text x="24" y="62" font-size="13" fill="#444444">Bir satır birden çok yöntem taşır; oranlar 45 satıra göredir ve toplamı %100'ü aşar (bu yüzden pasta değil çubuk). Kural: §6.2.3.</text>
  <g id="izgara">
    <line x1="230.000" y1="104" x2="230.000" y2="350" stroke="#d9d9d6" stroke-width="1"/>
    <text x="230.000" y="98" text-anchor="middle" font-size="11" fill="#444444">%0</text>
    <line x1="347.000" y1="104" x2="347.000" y2="350" stroke="#d9d9d6" stroke-width="1"/>
    <text x="347.000" y="98" text-anchor="middle" font-size="11" fill="#444444">%20</text>
    <line x1="464.000" y1="104" x2="464.000" y2="350" stroke="#d9d9d6" stroke-width="1"/>
    <text x="464.000" y="98" text-anchor="middle" font-size="11" fill="#444444">%40</text>
    <line x1="581.000" y1="104" x2="581.000" y2="350" stroke="#d9d9d6" stroke-width="1"/>
    <text x="581.000" y="98" text-anchor="middle" font-size="11" fill="#444444">%60</text>
    <line x1="698.000" y1="104" x2="698.000" y2="350" stroke="#d9d9d6" stroke-width="1"/>
    <text x="698.000" y="98" text-anchor="middle" font-size="11" fill="#444444">%80</text>
    <line x1="815.000" y1="104" x2="815.000" y2="350" stroke="#d9d9d6" stroke-width="1"/>
    <text x="815.000" y="98" text-anchor="middle" font-size="11" fill="#444444">%100</text>
  </g>
  <g id="cubuklar" data-satir-toplam="45" data-px-per-satir="13.000" data-x0="230.000">
    <text x="216.000" y="132" text-anchor="end" font-size="14" fill="#111111">test</text>
    <rect class="cubuk" data-yontem="test" data-satir="39" data-oran="%86,7" x="230.000" y="112" width="507.000" height="30" rx="3" fill="#4a6fa5"/>
    <text x="747.000" y="132" font-size="13" fill="#111111">39 satır · %86,7</text>
    <text x="216.000" y="182" text-anchor="end" font-size="14" fill="#111111">gözle muayene</text>
    <rect class="cubuk" data-yontem="gözle muayene" data-satir="11" data-oran="%24,4" x="230.000" y="162" width="143.000" height="30" rx="3" fill="#4a6fa5"/>
    <text x="383.000" y="182" font-size="13" fill="#111111">11 satır · %24,4</text>
    <text x="216.000" y="232" text-anchor="end" font-size="14" fill="#111111">simülasyon</text>
    <rect class="cubuk" data-yontem="simülasyon" data-satir="7" data-oran="%15,6" x="230.000" y="212" width="91.000" height="30" rx="3" fill="#4a6fa5"/>
    <text x="331.000" y="232" font-size="13" fill="#111111">7 satır · %15,6</text>
    <text x="216.000" y="282" text-anchor="end" font-size="14" fill="#111111">hesaplama</text>
    <rect class="cubuk" data-yontem="hesaplama" data-satir="5" data-oran="%11,1" x="230.000" y="262" width="65.000" height="30" rx="3" fill="#4a6fa5"/>
    <text x="305.000" y="282" font-size="13" fill="#111111">5 satır · %11,1</text>
    <text x="216.000" y="332" text-anchor="end" font-size="14" fill="#111111">analiz</text>
    <rect class="cubuk" data-yontem="analiz" data-satir="4" data-oran="%8,9" x="230.000" y="312" width="52.000" height="30" rx="3" fill="#4a6fa5"/>
    <text x="292.000" y="332" font-size="13" fill="#111111">4 satır · %8,9</text>
  </g>
  <line x1="230.000" y1="104" x2="230.000" y2="350" stroke="#888888" stroke-width="1"/>
  <text x="815.000" y="368" text-anchor="end" font-size="11" fill="#444444">%100 = 45 satır</text>
  <text x="24" y="426" font-size="12" fill="#444444">kaynak: FDR Bölüm 6 §6.6.3 (yeniden sayım 5 Eylül sonrası: 66 atama) · 7 Eylül 2026 · üretici: scripts/fdr_sekil_uret.py</text>
</svg>
