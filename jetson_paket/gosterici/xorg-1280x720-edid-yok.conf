# TAHMIN / DOGRULANACAK — Jetson Orin Nano DevKit (JetPack 7.2.1, nvidia Xorg surucusu) uzerinde
# DENENMEDI (T228, 10 Eylul 2026). Kaynak belirsiz: asagidaki secenekler NVIDIA masaustu X surucusu
# belgesinden (ConnectedMonitor, UseEDID, ModeValidation "AllowNonEdidModes", CustomEDID) ve NVIDIA
# forum konusu 263892'den (Jetson'da EDID'siz ekran; ModeValidation/CustomEDID) derlendi. Jetson
# surucusunun bu seceneklerin HEPSINI destekledigi DOGRULANMADI.
#
# NE ZAMAN: SIYI HDMI giris donusturucusu EDID vermezse / HPD kaldirmazsa (belgesiz) X acilmaz
#   ("no screens found") ya da DP cikisi kapali kalir -> gosterici siyah ekran. ONCE bak:
#     DISPLAY=:0 xrandr --query                  # DP-0 connected mi, 1280x720 kipi var mi
#     grep -i edid /var/log/Xorg.0.log           # EDID okundu mu
#   Yalniz EDID YOKSA bu dosyayi kullan.
# KURULUM (once yedek): sudo cp /etc/X11/xorg.conf /etc/X11/xorg.conf.navitas_yedek
#   sudo cp xorg-1280x720-edid-yok.conf /etc/X11/xorg.conf.d/90-navitas-edid-yok.conf
#   sudo systemctl restart gdm
#   Jetson'un kendi /etc/X11/xorg.conf Device bolumu bununla CAKISABILIR — cakisirsa Device'taki
#   Option satirlarini oradaki bolume tasi.
# GERI ALMA: sudo rm /etc/X11/xorg.conf.d/90-navitas-edid-yok.conf && sudo systemctl restart gdm
# Konektor adi "DFP-0" TAHMINDIR — Xorg.0.log'daki gercek adla degistir.

Section "Monitor"
    Identifier  "NavitasSahte720p"
    HorizSync   30.0-81.0
    VertRefresh 50.0-76.0
    # CEA-861 1280x720 @ 60 Hz (74,25 MHz); donusturucu 1080p30'a kadar H.264 kodlar
    Modeline    "1280x720_60" 74.25 1280 1390 1430 1650 720 725 730 750 +HSync +VSync
    Option      "PreferredMode" "1280x720_60"
EndSection

Section "Device"
    Identifier  "NavitasTegra"
    Driver      "nvidia"
    Option      "AllowEmptyInitialConfiguration" "true"
    Option      "ConnectedMonitor" "DFP-0"
    Option      "UseEDID" "false"
    Option      "ModeValidation" "AllowNonEdidModes, NoEdidMaxPClkCheck, NoMaxPClkCheck, NoHorizSyncCheck, NoVertRefreshCheck"
    # Alternatif (EDID dosyasi eldeyse): Option "CustomEDID" "DFP-0:/etc/X11/navitas_1280x720.bin"
EndSection

Section "Screen"
    Identifier  "NavitasEkran"
    Device      "NavitasTegra"
    Monitor     "NavitasSahte720p"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1280x720_60"
    EndSubSection
EndSection
