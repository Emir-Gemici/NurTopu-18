name: quality

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q codes comms dataset drone simulation
      - run: bash -n simulation/launch/navitas.launch simulation/launch.sh simulation/docker/*.sh
      - run: python simulation/scripts/world_generator.py --focus zor --map 5 --seed 42 --output /tmp/navitas-ci.world
